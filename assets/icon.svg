<?xml version="1.0" encoding="UTF-8"?>
<!--
  Atalaia — a marca.

  Um vigia a espreitar de dentro do recorte. A app vigia agentes e chama por
  ti; a marca é a criatura que faz isso, não o gesto abstrato do som.

  Desenhado para 16 px, não para 512: a cabeça ocupa mais de metade do quadro e
  os olhos são o elemento de maior contraste de todo o ícone. Duas luzes claras
  sobre escuro é a única coisa que se lê sem falhas na menu bar — e é também o
  que dá presença: um ícone que olha de volta.

  Versões anteriores, e porque morreram: três arcos concêntricos (o terceiro
  desaparecia a 16 px); dois arcos com um ponto de luz (lia-se como cara triste,
  o ponto virava nariz).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"
     role="img" aria-label="Atalaia">
  <defs>
    <linearGradient id="corpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262B"/>
      <stop offset="1" stop-color="#0A0A0C"/>
    </linearGradient>
    <linearGradient id="cabeca" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD07A"/>
      <stop offset="1" stop-color="#D97757"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC46B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFC46B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="moldura">
      <rect x="96" y="96" width="832" height="832" rx="196" ry="196"/>
    </clipPath>
  </defs>

  <rect x="96" y="96" width="832" height="832" rx="196" ry="196" fill="url(#corpo)"/>

  <g clip-path="url(#moldura)">
    <circle cx="512" cy="600" r="330" fill="url(#halo)"/>

    <!-- O recorte, rente ao topo: é o sítio de onde ele espreita. -->
    <path d="M 372 80 L 652 80 L 652 268 Q 652 322 598 322 L 426 322 Q 372 322 372 268 Z"
          fill="#000000"/>

    <!-- As antenas, atrás da cabeça. -->
    <g stroke="#8A6A52" stroke-width="26" stroke-linecap="round">
      <path d="M 398 470 L 356 372"/>
      <path d="M 626 470 L 668 372"/>
    </g>
    <circle cx="352" cy="356" r="30" fill="#FFD07A"/>
    <circle cx="672" cy="356" r="30" fill="#FFD07A"/>

    <!-- A cabeça. Ocupa o quadro para sobreviver à escala. -->
    <rect x="290" y="424" width="444" height="392" rx="150" ry="150" fill="url(#cabeca)"/>

    <!-- Os olhos: o maior contraste do ícone, e o que se lê a 16 px. -->
    <ellipse cx="418" cy="606" rx="52" ry="62" fill="#131316"/>
    <ellipse cx="606" cy="606" rx="52" ry="62" fill="#131316"/>
    <circle cx="434" cy="586" r="17" fill="#FFF2D4"/>
    <circle cx="622" cy="586" r="17" fill="#FFF2D4"/>
  </g>
</svg>
